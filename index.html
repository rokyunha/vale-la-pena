<style>
/* Una columna para el pulgar: arriba elegir, al medio responder, abajo el resultado. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #1b2420;
  --muted: #5d6a63;
  --line: #d8ded9;
  --accent: #2f5d4e;
  --accent-ink: #ffffff;
  --sel-yes: #2f6b4a;
  --sel-unk: #9a6a12;
  --sel-no: #4b5560;
  --green-bg: #e3f1e7; --green-ink: #1f5a36; --green-edge: #8fc3a0;
  --amber-bg: #fbefd6; --amber-ink: #7a4f06; --amber-edge: #e2b866;
  --gray-bg: #e8eaec; --gray-ink: #3b444d; --gray-edge: #aeb5bc;
  --orange-bg: #fde6da; --orange-ink: #8a3b17; --orange-edge: #e9a283;
  --blue-bg: #e1e9f9; --blue-ink: #24448a; --blue-edge: #8ea8e0;
  --red-bg: #fbe1df; --red-ink: #8f2620; --red-edge: #e69a95;
  --q-hacer: #5f9a7b; --q-programar: #df8a68; --q-delegar: #4a6fc0; --q-eliminar: #d9625c;
  --danger: #a3352b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1b211e; --ink: #e6ebe7; --muted: #9aa69f; --line: #2e3631;
  --accent: #7fb9a2; --accent-ink: #0e1a15;
  --sel-yes: #4f9a6c; --sel-unk: #c4912f; --sel-no: #6f7a85;
  --green-bg: #1b3325; --green-ink: #a9dcb9; --green-edge: #3d7552;
  --amber-bg: #3a2c10; --amber-ink: #f0cd85; --amber-edge: #8a6620;
  --gray-bg: #262b30; --gray-ink: #c9cfd5; --gray-edge: #4d555d;
  --orange-bg: #3d2318; --orange-ink: #f5b89c; --orange-edge: #91553a;
  --blue-bg: #1c2742; --blue-ink: #aac0f0; --blue-edge: #415d9e;
  --red-bg: #3d1d1b; --red-ink: #f2a7a2; --red-edge: #95433e;
  --q-hacer: #4e8566; --q-programar: #c4714f; --q-delegar: #3d5fa8; --q-eliminar: #bf4f49;
  --danger: #e2786d; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211e; --ink: #e6ebe7; --muted: #9aa69f; --line: #2e3631;
  --accent: #7fb9a2; --accent-ink: #0e1a15;
  --sel-yes: #4f9a6c; --sel-unk: #c4912f; --sel-no: #6f7a85;
  --green-bg: #1b3325; --green-ink: #a9dcb9; --green-edge: #3d7552;
  --amber-bg: #3a2c10; --amber-ink: #f0cd85; --amber-edge: #8a6620;
  --gray-bg: #262b30; --gray-ink: #c9cfd5; --gray-edge: #4d555d;
  --orange-bg: #3d2318; --orange-ink: #f5b89c; --orange-edge: #91553a;
  --blue-bg: #1c2742; --blue-ink: #aac0f0; --blue-edge: #415d9e;
  --red-bg: #3d1d1b; --red-ink: #f2a7a2; --red-edge: #95433e;
  --q-hacer: #4e8566; --q-programar: #c4714f; --q-delegar: #3d5fa8; --q-eliminar: #bf4f49;
  --danger: #e2786d; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.35rem; letter-spacing: -0.01em; }
h2 { font-size: 1.1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.badge { background: var(--amber-edge); color: #2b1d00; border-radius: 999px; font-size: 0.75rem; padding: 0 7px; min-width: 20px; text-align: center; }

.banner { border-radius: var(--r); padding: 10px 12px; font-size: 0.9rem; border: 1px solid var(--amber-edge); background: var(--amber-bg); color: var(--amber-ink); }
.banner.err { border-color: var(--danger); color: var(--danger); background: var(--surface); }
.banner.ok { border-color: var(--green-edge); background: var(--green-bg); color: var(--green-ink); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg label { display: block; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: flex; align-items: center; justify-content: center; height: 100%; line-height: 1.2; text-align: center; padding: 12px 6px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.seg input:checked + span { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

.field { display: grid; gap: 6px; }
.field label, .lbl { font-weight: 600; font-size: 0.92rem; }
.txt { width: 100%; padding: 12px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); }
textarea.txt { min-height: 70px; resize: vertical; }

.qs { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: q; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.q legend { padding: 0; font-weight: 600; display: flex; gap: 8px; }
.q legend b { font-family: var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.q fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.opts.dos { grid-template-columns: repeat(2, 1fr); }
.opts label { display: block; }
.opts input { position: absolute; opacity: 0; pointer-events: none; }
.opts span { display: block; text-align: center; padding: 11px 4px; border-radius: 10px; border: 1.5px solid var(--line); font-weight: 600; user-select: none; }
.opts input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.opts input[value="yes"]:checked + span { background: var(--sel-yes); border-color: var(--sel-yes); color: #fff; }
.opts input[value="unknown"]:checked + span { background: var(--sel-unk); border-color: var(--sel-unk); color: #fff; }
.opts input[value="no"]:checked + span { background: var(--sel-no); border-color: var(--sel-no); color: #fff; }

.btn { border: 0; border-radius: var(--r); padding: 13px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.slim { width: auto; padding: 9px 14px; font-size: 0.92rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.hint { text-align: center; }

.res { border-radius: var(--r); border: 2px solid var(--gray-edge); background: var(--gray-bg); color: var(--gray-ink); padding: 16px; display: grid; gap: 8px; }
.res.verde { border-color: var(--green-edge); background: var(--green-bg); color: var(--green-ink); }
.res.ambar { border-color: var(--amber-edge); background: var(--amber-bg); color: var(--amber-ink); }
.res.naranja, .pill.naranja { border-color: var(--orange-edge); background: var(--orange-bg); color: var(--orange-ink); }
.res.azul, .pill.azul { border-color: var(--blue-edge); background: var(--blue-bg); color: var(--blue-ink); }
.res.rojo, .pill.rojo { border-color: var(--red-edge); background: var(--red-bg); color: var(--red-ink); }

.matriz { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; align-items: stretch; }
.mx-h { text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.mx-v { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.mx { border-radius: 10px; padding: 14px 8px; text-align: center; color: #fff; font-family: var(--font-display); font-weight: 700; opacity: 0.28; display: grid; gap: 2px; place-content: center; min-height: 64px; }
.mx small { font-family: var(--font-body); font-weight: 500; font-size: 0.74rem; }
.mx.on { opacity: 1; outline: 3px solid var(--ink); outline-offset: 2px; }
.q-hacer { background: var(--q-hacer); } .q-programar { background: var(--q-programar); }
.q-delegar { background: var(--q-delegar); } .q-eliminar { background: var(--q-eliminar); }
.res-head { display: flex; align-items: center; gap: 10px; }
.res-head svg { width: 30px; height: 30px; flex: none; }
.res-label { font-family: var(--font-display); font-size: 1.55rem; letter-spacing: 0.01em; text-transform: uppercase; }
.res-motivo { font-size: 1.05rem; font-weight: 600; }
.res-accion { font-size: 0.95rem; }
.res-nota { font-size: 0.85rem; opacity: 0.9; border-top: 1px solid currentColor; padding-top: 8px; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 8px; }
.ans { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.ans li { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 0.9rem; align-items: start; }
.chip { font-size: 0.78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); }
.chip.yes { background: var(--sel-yes); color: #fff; border-color: transparent; }
.chip.unknown { background: var(--sel-unk); color: #fff; border-color: transparent; }
.chip.no { background: var(--sel-no); color: #fff; border-color: transparent; }
.obj { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.9rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }

.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters select { width: 100%; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); }
.check { display: flex; gap: 8px; align-items: center; font-size: 0.92rem; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.item { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 4px; }
.item-top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.item-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.pill { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--gray-edge); background: var(--gray-bg); color: var(--gray-ink); display: inline-flex; gap: 4px; align-items: center; }
.pill svg { width: 12px; height: 12px; }
.pill.verde { border-color: var(--green-edge); background: var(--green-bg); color: var(--green-ink); }
.pill.ambar { border-color: var(--amber-edge); background: var(--amber-bg); color: var(--amber-ink); }
.meta { font-size: 0.82rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.due { color: var(--amber-ink); background: var(--amber-bg); border-radius: 6px; padding: 0 6px; font-weight: 600; }
.empty { text-align: center; padding: 20px 12px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: var(--r); }

.choice { display: flex; flex-wrap: wrap; gap: 6px; }
.choice button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 0.9rem; font-weight: 600; }
.choice button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-weight: 600; }
.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
@media (prefers-reduced-motion: no-preference) { .res { animation: aparece .18s ease-out; } @keyframes aparece { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>

<div class="wrap">
  <header class="top">
    <h1>¿Vale la pena?</h1>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button id="tab-evaluar" role="tab" aria-selected="true">Evaluar</button>
      <button id="tab-historial" role="tab" aria-selected="false">Historial <span id="badge" class="badge" hidden>0</span></button>
    </nav>
  </header>

  <div id="aviso" class="banner" hidden></div>

  <!-- EVALUAR -->
  <section id="vista-evaluar" class="wrap" style="gap:14px">
    <div id="reeval-info" class="banner ok" hidden></div>
    <div class="seg" role="radiogroup" aria-label="Qué estás evaluando">
      <label><input type="radio" name="modo" id="modo-negocio" value="negocio"><span id="lbl-negocio">Trabajo</span></label>
      <label><input type="radio" name="modo" id="modo-personal" value="personal"><span>Compras personales</span></label>
      <label><input type="radio" name="modo" id="modo-tareas" value="tareas"><span>Tareas</span></label>
    </div>
    <div class="field">
      <label for="nombre">¿Qué estás evaluando?</label>
      <input id="nombre" class="txt" maxlength="120" autocomplete="off" placeholder="Ej.: una app, un curso, unos audífonos">
    </div>
    <ol id="preguntas" class="qs"></ol>
    <p id="falta" class="muted small hint"></p>
    <button id="btn-ver" class="btn" disabled>Ver resultado</button>

    <div id="resultado" hidden style="display:grid;gap:12px"></div>
  </section>

  <!-- HISTORIAL -->
  <section id="vista-historial" class="wrap" style="gap:14px" hidden>
    <div id="pendientes"></div>
    <div class="filters">
      <select id="f-modo" aria-label="Filtrar por modo">
        <option value="">Todos los modos</option>
        <option value="negocio">Trabajo</option>
        <option value="personal">Compras personales</option>
        <option value="tareas">Tareas</option>
      </select>
      <select id="f-res" aria-label="Filtrar por resultado"><option value="">Todos los resultados</option></select>
    </div>
    <label class="check"><input type="checkbox" id="f-arch"> Mostrar archivados</label>
    <ul id="lista" class="list"></ul>
    <div id="detalle"></div>

    <details id="respaldo">
      <summary>Respaldo</summary>
      <div style="display:grid;gap:10px">
        <p id="txt-respaldo" class="small muted">Tu historial se guarda solo en este navegador: nadie más lo ve. Si borras los datos del navegador o cambias de celular, se pierde. Descarga un respaldo de vez en cuando y guárdalo en tu correo.</p>
        <div class="row">
          <button id="btn-exportar" class="btn sec">Descargar respaldo</button>
          <button id="btn-copiar" class="btn sec">Copiar respaldo</button>
        </div>
        <hr class="sep">
        <label class="lbl" for="imp-archivo">Importar un respaldo</label>
        <input id="imp-archivo" type="file" accept="application/json,.json">
        <textarea id="imp-texto" class="txt" placeholder="O pega aquí el texto del respaldo"></textarea>
        <button id="btn-importar" class="btn sec">Importar</button>
        <p id="imp-msg" class="small" role="status"></p>
      </div>
    </details>
  </section>
</div>

<script id="motor">

    ]

  var RESULTADOS = {

  var POR_MODO = {
    negocio: ["PRUEBA", "ACLARA", "PAUSA", "USA_LO_QUE_TIENES", "NO_AVANZAR"],
    personal: ["COMPRA_RAZONABLE", "ACLARA", "ESPERA", "NO_COMPRAR_AHORA"],
    tareas: ["HACER", "PROGRAMAR", "DELEGAR", "ELIMINAR"]
  };

  function completa(modo, r) {
    if (!PREGUNTAS[modo] || !Array.isArray(r) || r.length !== PREGUNTAS[modo].length) return false;
    for (var i = 0; i < r.length; i++) if (VALORES_MODO[modo].indexOf(r[i]) < 0) return false;
    return true;
  }

  /* Tareas: importante si la 1 o la 2 es Sí; urgente si la 3 o la 4 es Sí. */
  var CUADRANTES = {
    HACER:     { motivo: "Es importante y urgente", accion: "Hazlo tú, hoy." },
    PROGRAMAR: { motivo: "Es importante, pero no urgente", accion: "Ponle fecha en tu agenda." },
    DELEGAR:   { motivo: "Es urgente, pero no es importante para tu meta", accion: "Pásaselo a alguien y define cuándo revisarlo." },
    ELIMINAR:  { motivo: "No es importante ni urgente", accion: "Sácalo de tu lista." }
  };
  function evaluarTarea(r) {
    var importante = r[0] === "yes" || r[1] === "yes";
    var urgente = r[2] === "yes" || r[3] === "yes";
    var codigo = importante ? (urgente ? "HACER" : "PROGRAMAR") : (urgente ? "DELEGAR" : "ELIMINAR");
    return {
      codigo: codigo, etiqueta: RESULTADOS[codigo].etiqueta, tono: RESULTADOS[codigo].tono, icono: RESULTADOS[codigo].icono,
      pregunta: null, motivo: CUADRANTES[codigo].motivo, accion: CUADRANTES[codigo].accion, revisar_dias: null,
      otras: [], nota: null, importante: importante, urgente: urgente, version_reglas: VERSION_REGLAS
    };
  }

  function primera(r, valor, desde, hasta) {
    for (var i = desde; i <= hasta; i++) if (r[i] === valor) return i;
    return -1;
  }

  /* Devuelve el resultado, o lanza un error si la evaluación está incompleta. */
  function evaluar(modo, r) {
    if (!completa(modo, r)) throw new Error("evaluacion_incompleta");
    if (modo === "tareas") return evaluarTarea(r);
    var c = null; // {codigo, pregunta (índice que decide), accion, revisar_dias}
    if (modo === "negocio") {
      if (r[0] === "no" || r[1] === "no") c = { codigo: "PAUSA", pregunta: r[0] === "no" ? 0 : 1, accion: "Guárdalo para revisarlo en 30 días.", revisar_dias: 30 };
      else if (r[2] === "no") c = { codigo: "USA_LO_QUE_TIENES", pregunta: 2, accion: "Prueba primero con tus herramientas actuales.", revisar_dias: null };
      else if (r[3] === "no") c = { codigo: "NO_AVANZAR", pregunta: 3, accion: "Archívalo por ahora.", revisar_dias: null };
      else if (r[4] === "no") c = { codigo: "PAUSA", pregunta: 4, accion: "Guárdalo para revisarlo en 30 días.", revisar_dias: 30 };
      else if (primera(r, "unknown", 0, 4) >= 0) c = { codigo: "ACLARA", pregunta: primera(r, "unknown", 0, 4), accion: "Resuelve esa duda con una investigación acotada: máximo 10 minutos.", revisar_dias: null };
      else c = { codigo: "PRUEBA", pregunta: null, accion: "Define un objetivo y un límite de tiempo para el piloto.", revisar_dias: null };
    } else {
      if (r[3] === "no") c = { codigo: "NO_COMPRAR_AHORA", pregunta: 3, accion: "Posterga la compra.", revisar_dias: null };
      else if (primera(r, "no", 0, 2) >= 0) c = { codigo: "NO_COMPRAR_AHORA", pregunta: primera(r, "no", 0, 2), accion: "Archívalo por ahora.", revisar_dias: null };
      else if (primera(r, "unknown", 0, 3) >= 0) c = { codigo: "ACLARA", pregunta: primera(r, "unknown", 0, 3), accion: "Resuelve esa duda antes de decidir.", revisar_dias: null };
      else if (r[4] !== "yes") c = { codigo: "ESPERA", pregunta: 4, accion: "Espera 7 días y vuelve a responder.", revisar_dias: 7 };
      else c = { codigo: "COMPRA_RAZONABLE", pregunta: null, accion: "Si decides comprarlo, regístralo aquí.", revisar_dias: null };
    }

    var motivo;
    if (c.codigo === "PRUEBA") motivo = "Tiene sentido hacer una prueba pequeña";
    else if (c.codigo === "COMPRA_RAZONABLE") motivo = "La compra cumple las cinco condiciones del filtro";
    else if (c.codigo === "ACLARA") motivo = MOTIVO_DUDA[modo][c.pregunta];
    else motivo = MOTIVO_NO[modo][c.pregunta];

    // Otras objeciones: cada No y No sé que no es el motivo principal, en orden.
    var otras = [];
    for (var i = 0; i < 5; i++) {
      if (i === c.pregunta) continue;
      if (r[i] === "no") otras.push({ pregunta: i, respuesta: "no", texto: MOTIVO_NO[modo][i] });
      else if (r[i] === "unknown") otras.push({ pregunta: i, respuesta: "unknown", texto: MOTIVO_DUDA[modo][i] });
    }

    var nota = null;
    if (c.codigo === "PRUEBA") nota = "Esto no autoriza contratar ni implementar: es para una prueba chica, con objetivo y plazo.";
    if (c.codigo === "COMPRA_RAZONABLE") nota = "Compra razonable no significa que debas comprarlo ni garantiza que te vaya a gustar.";

    return {
      codigo: c.codigo,
      etiqueta: RESULTADOS[c.codigo].etiqueta,
      tono: RESULTADOS[c.codigo].tono,
      icono: RESULTADOS[c.codigo].icono,
      pregunta: c.pregunta,
      motivo: motivo,
      accion: c.accion,
      revisar_dias: c.revisar_dias,
      otras: otras,
      nota: nota,
      version_reglas: VERSION_REGLAS
    };
  }

  return { VERSION_REGLAS: VERSION_REGLAS, VALORES: VALORES, VALORES_MODO: VALORES_MODO, PREGUNTAS: PREGUNTAS, RESULTADOS: RESULTADOS, POR_MODO: POR_MODO, completa: completa, evaluar: evaluar };
})();

<script id="registros">
/* El registro de cada evaluación, el respaldo y el almacenamiento. Sin pantalla. */
var REGISTROS = (function () {
  var DECISIONES = {
    negocio: [["probe", "Lo probé"], ["contrate", "Lo contraté"], ["no_hice", "No lo hice"]],
    personal: [["compre", "Lo compré"], ["no_compre", "No lo compré"]],
    tareas: [["hecha", "Hecha"], ["descartada", "Descartada"]]
  };
  var VALORACIONES = [["valio", "Valió la pena"], ["parcial", "Parcialmente"], ["no", "No"], ["nose", "Aún no sé"]];
  var ID_OK = /^[A-Za-z0-9_-]{1,64}$/;
  var FECHA_OK = /^\d{4}-\d{2}-\d{2}$/;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fechaLocal(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function sumarDias(fecha, dias) {
    var p = fecha.split("-").map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + dias, 12);
    return fechaLocal(d);
  }
  function nuevoId() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return "ev-" + crypto.randomUUID();
    return "ev-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function crear(modo, nombre, respuestas, ahora, anteriorId) {
    var nom = String(nombre || "").trim();
    if (!nom) throw new Error("falta_nombre");
    var res = MOTOR.evaluar(modo, respuestas); // lanza si está incompleta
    var hoy = fechaLocal(ahora);
    return {
      id: nuevoId(),
      nombre: nom.slice(0, 120),
      modo: modo,
      creado_en: ahora.toISOString(),
      actualizado_en: ahora.toISOString(),
      respuestas: respuestas.slice(),
      resultado: res.codigo,
      motivo: res.motivo,
      version_reglas: res.version_reglas,
      nota: "",
      revisar_en: res.revisar_dias ? sumarDias(hoy, res.revisar_dias) : null,
      decision: null,
      valoracion: null,
      piloto: null,
      seguimiento: null,
      anterior_id: anteriorId || null,
      archivado: false
    };
  }

  function texto(v, max) { return typeof v === "string" && v.length <= max; }

  /* Valida un registro que viene de un respaldo. Devuelve el registro limpio o null. */
  function validar(x) {
    if (!x || typeof x !== "object" || Array.isArray(x)) return null;
    if (!texto(x.id, 64) || !ID_OK.test(x.id)) return null;
    if (!MOTOR.PREGUNTAS[x.modo]) return null;
    if (!texto(x.nombre, 120) || !x.nombre.trim()) return null;
    if (!MOTOR.completa(x.modo, x.respuestas)) return null;
    if (MOTOR.POR_MODO[x.modo].indexOf(x.resultado) < 0) return null;
    if (!texto(x.motivo, 300)) return null;
    if (!texto(x.creado_en, 40) || isNaN(Date.parse(x.creado_en))) return null;
    var act = texto(x.actualizado_en, 40) && !isNaN(Date.parse(x.actualizado_en)) ? x.actualizado_en : x.creado_en;
    if (x.revisar_en != null && !(texto(x.revisar_en, 10) && FECHA_OK.test(x.revisar_en))) return null;
    var decOk = x.decision == null || DECISIONES[x.modo].some(function (d) { return d[0] === x.decision; });
    if (!decOk) return null;
    var valOk = x.valoracion == null || VALORACIONES.some(function (v) { return v[0] === x.valoracion; });
    if (!valOk) return null;
    if (x.anterior_id != null && !(texto(x.anterior_id, 64) && ID_OK.test(x.anterior_id))) return null;
    var piloto = null;
    if (x.piloto != null) {
      var p = x.piloto;
      if (typeof p !== "object" || !texto(p.objetivo || "", 300) || !texto(p.limite || "", 120)) return null;
      if (p.revisar_en != null && !(texto(p.revisar_en, 10) && FECHA_OK.test(p.revisar_en))) return null;
      piloto = { objetivo: p.objetivo || "", limite: p.limite || "", revisar_en: p.revisar_en || null };
    }
    var seguimiento = null;
    if (x.seguimiento != null) {
      var s = x.seguimiento;
      if (typeof s !== "object" || !texto(s.responsable || "", 120)) return null;
      if (s.fecha != null && !(texto(s.fecha, 10) && FECHA_OK.test(s.fecha))) return null;
      seguimiento = { responsable: s.responsable || "", fecha: s.fecha || null };
    }
    return {
      id: x.id, nombre: x.nombre.trim(), modo: x.modo, creado_en: x.creado_en, actualizado_en: act,
      respuestas: x.respuestas.slice(), resultado: x.resultado, motivo: x.motivo,
      version_reglas: texto(x.version_reglas, 40) ? x.version_reglas : "desconocida",
      nota: texto(x.nota, 2000) ? x.nota : "",
      revisar_en: x.revisar_en || null, decision: x.decision || null, valoracion: x.valoracion || null,
      piloto: piloto, seguimiento: seguimiento, anterior_id: x.anterior_id || null, archivado: x.archivado === true
    };
  }

  function exportar(lista, ahora) {
    return { app: "filtro-decisiones", formato: 1, exportado_en: ahora.toISOString(), registros: lista.map(function (r) { return JSON.parse(JSON.stringify(r)); }) };
  }

  /* Lee un respaldo (texto JSON). Lanza un error legible si no sirve. */
  function leerRespaldo(txt) {
    var obj;
    try { obj = JSON.parse(txt); } catch (e) { throw new Error("El texto no es un respaldo válido (JSON mal formado)."); }
    var arr = Array.isArray(obj) ? obj : (obj && obj.app === "filtro-decisiones" && Array.isArray(obj.registros) ? obj.registros : null);
    if (!arr) throw new Error("Este archivo no es un respaldo del filtro de decisiones.");
    var validos = [], invalidos = 0, vistos = {};
    arr.forEach(function (x) {
      var v = validar(x);
      if (!v) { invalidos++; return; }
      if (vistos[v.id]) return;
      vistos[v.id] = true; validos.push(v);
    });
    return { validos: validos, invalidos: invalidos };
  }

  /* Decide qué guardar al importar: nuevos, más recientes que los actuales; lo igual o más viejo se omite. */
  function fusionar(actuales, entrantes) {
    var porId = {};
    actuales.forEach(function (r) { porId[r.id] = r; });
    var guardar = [], nuevos = 0, actualizados = 0, omitidos = 0;
    entrantes.forEach(function (r) {
      var ya = porId[r.id];
      if (!ya) { guardar.push(r); nuevos++; }
      else if (Date.parse(r.actualizado_en) > Date.parse(ya.actualizado_en)) { guardar.push(r); actualizados++; }
      else omitidos++;
    });
    return { guardar: guardar, nuevos: nuevos, actualizados: actualizados, omitidos: omitidos };
  }

  function fechaRevision(r) { return (r.piloto && r.piloto.revisar_en) || (r.seguimiento && r.seguimiento.fecha) || r.revisar_en || null; }
  function reevaluadoPor(lista, id) {
    var hijos = lista.filter(function (x) { return x.anterior_id === id; });
    hijos.sort(function (a, b) { return a.creado_en < b.creado_en ? 1 : -1; });
    return hijos[0] || null;
  }
  /* Habilitada si no tiene fecha o la fecha ya llegó. Nunca aprueba sola. */
  function puedeReevaluar(r, hoy) { var f = fechaRevision(r); return !f || f <= hoy; }
  function pendientes(lista, hoy) {
    return lista.filter(function (r) {
      if (r.archivado || reevaluadoPor(lista, r.id)) return false;
      if (r.modo === "tareas") {
        if (r.decision) return false;          // hecha o descartada
        if (r.resultado === "HACER") return true;
        if (r.resultado === "ELIMINAR") return false;
      }
      var f = fechaRevision(r);
      if (f) return f <= hoy;
      return r.resultado === "ACLARA";
    }).sort(function (a, b) { return (fechaRevision(a) || "") < (fechaRevision(b) || "") ? -1 : 1; });
  }

  /* El almacenamiento: un documento por evaluación en una colección. */
  var RUTA = "evaluaciones";
  function almacen(db) {
    var col = db.collection(RUTA);
    return {
      suscribir: function (alCambiar, alError) {
        return col.onSnapshot(function (snap) {
          alCambiar(snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return d.data(); }));
        }, alError);
      },
      leerTodo: function () { return col.get().then(function (s) { return s.docs.map(function (d) { return d.data(); }); }); },
      guardar: function (reg) {
        var limpio = JSON.parse(JSON.stringify(reg));
        return col.doc(reg.id).set(limpio).then(function () { return col.doc(reg.id).get(); }).then(function (s) {
          if (!s.exists) throw new Error("no_verificado");
          return s.data();
        });
      },
      borrar: function (id) { return col.doc(id).delete(); }
    };
  }

  /* La versión pública guarda en el navegador de cada persona, con la misma forma que almacen(). */
  var CLAVE_LOCAL = "filtro-decisiones.v1";
  function almacenLocal(ls) {
    var oyentes = [];
    function leer() { var t = ls.getItem(CLAVE_LOCAL); var m = t ? JSON.parse(t) : {}; return m && typeof m === "object" ? m : {}; }
    function lista() { var m = leer(); return Object.keys(m).map(function (k) { return m[k]; }); }
    function avisar() { var l = lista(); oyentes.forEach(function (cb) { cb(l); }); }
    function escribir(fn) {
      return new Promise(function (ok, mal) {
        try { var m = leer(); fn(m); ls.setItem(CLAVE_LOCAL, JSON.stringify(m)); ok(leer()); }
        catch (e) { mal({ code: "local", message: String(e && e.message || e) }); }
      });
    }
    return {
      suscribir: function (alCambiar, alError) {
        try { oyentes.push(alCambiar); alCambiar(lista()); } catch (e) { if (alError) alError({ code: "local" }); }
        return function () { oyentes = oyentes.filter(function (x) { return x !== alCambiar; }); };
      },
      leerTodo: function () { return new Promise(function (ok) { ok(lista()); }); },
      guardar: function (reg) {
        var limpio = JSON.parse(JSON.stringify(reg));
        return escribir(function (m) { m[reg.id] = limpio; }).then(function (m) {
          if (!m[reg.id] || JSON.stringify(m[reg.id]) !== JSON.stringify(limpio)) throw { code: "local", message: "no_verificado" };
          avisar(); return m[reg.id];
        });
      },
      borrar: function (id) { return escribir(function (m) { delete m[id]; }).then(function () { avisar(); }); }
    };
  }

  return {
    DECISIONES: DECISIONES, VALORACIONES: VALORACIONES, fechaLocal: fechaLocal, sumarDias: sumarDias,
    crear: crear, validar: validar, exportar: exportar, leerRespaldo: leerRespaldo, fusionar: fusionar,
    fechaRevision: fechaRevision, reevaluadoPor: reevaluadoPor, puedeReevaluar: puedeReevaluar, pendientes: pendientes,
    almacen: almacen, almacenLocal: almacenLocal
  };
})();
</script>

  var MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  function fechaCorta(f) { if (!f) return ""; var p = f.slice(0, 10).split("-"); return Number(p[2]) + "-" + MESES[Number(p[1]) - 1] + "-" + p[0]; }

  var registros = [];
  var store = null;      // null = todavía conectando o sin almacenamiento
  var storeListo = false;

  var confirmarBorrar = null;

    var valores = MOTOR.VALORES_MODO[estado.modo];
    ol.innerHTML = MOTOR.PREGUNTAS[estado.modo].map(function (q, i) {
      return '<li class="q"><fieldset><legend><b>' + (i + 1) + "</b><span>" + esc(q) + '</span></legend><div class="opts' + (valores.length === 2 ? " dos" : "") + '">' +
        valores.map(function (v) {
          var id = "q" + i + "-" + v;
          return '<label for="' + id + '"><input type="radio" id="' + id + '" name="q' + i + '" value="' + v + '"' + (estado.respuestas[i] === v ? " checked" : "") + "><span>" + TXT_RESP[v] + "</span></label>";
        }).join("") + "</div></fieldset></li>";
    }).join("");
  }

  function actualizarBoton() {
    var faltan = estado.respuestas.filter(function (r) { return r === null; }).length;
    var sinNombre = !$("nombre").value.trim();
    var msgs = [];
    if (!estado.modo) msgs.push("Elige un modo");
    else if (faltan) msgs.push(faltan === 1 ? "Falta 1 respuesta" : "Faltan " + faltan + " respuestas");
    if (sinNombre) msgs.push("escribe qué estás evaluando");
    var t = msgs.join(" y ");
    $("falta").textContent = t ? t.charAt(0).toUpperCase() + t.slice(1) + "." : "";
    $("btn-ver").disabled = !estado.modo || faltan > 0 || sinNombre;
  }

  function limpiarResultado() { estado.resultado = null; estado.guardado = null; $("resultado").hidden = true; $("resultado").innerHTML = ""; }

  function tarjetaResultado(res, modo, respuestas) {
    var preguntas = MOTOR.PREGUNTAS[modo];
    return '<div class="res ' + res.tono + '" role="status">' +
      '<div class="res-head">' + icono(res.icono) + '<span class="res-label">' + esc(res.etiqueta) + "</span></div>" +
      '<p class="res-motivo">' + esc(res.motivo) + "</p>" +
      '<p class="res-accion"><strong>Siguiente paso:</strong> ' + esc(res.accion) + "</p>" +
      (res.nota ? '<p class="res-nota">' + esc(res.nota) + "</p>" : "") + "</div>" +
      (modo === "tareas" ? matriz(res.codigo) : "") +
      (res.otras.length ? '<details><summary>Otras objeciones (' + res.otras.length + ')</summary><ul class="obj">' +
        res.otras.map(function (o) { return "<li>" + esc(o.texto) + ' <span class="muted small">(pregunta ' + (o.pregunta + 1) + ")</span></li>"; }).join("") + "</ul></details>" : "") +
      '<details><summary>Tus respuestas</summary><ul class="ans">' +
        preguntas.map(function (q, i) { return "<li><span>" + (i + 1) + ". " + esc(q) + '</span><span class="chip ' + respuestas[i] + '">' + TXT_RESP[respuestas[i]] + "</span></li>"; }).join("") +
      "</ul></details>";
  }

  function matriz(codigo) {
    function celda(c, clase, bajada) {
      return '<div class="mx ' + clase + (codigo === c ? " on" : "") + '"' + (codigo === c ? ' aria-current="true"' : "") + ">" + MOTOR.RESULTADOS[c].etiqueta + "<small>" + bajada + "</small></div>";
    }
    return '<div class="matriz" role="img" aria-label="Matriz de Eisenhower: tu tarea cae en ' + esc(MOTOR.RESULTADOS[codigo].etiqueta) + '">' +
      '<span></span><span class="mx-h">Urgente</span><span class="mx-h">No urgente</span>' +
      '<span class="mx-v">Importante</span>' + celda("HACER", "q-hacer", "tú, hoy") + celda("PROGRAMAR", "q-programar", "ponle fecha") +
      '<span class="mx-v">No importante</span>' + celda("DELEGAR", "q-delegar", "pásaselo a alguien") + celda("ELIMINAR", "q-eliminar", "sácalo de la lista") +
      "</div>";
  }

  function verResultado() {
    var res;
    try { res = MOTOR.evaluar(estado.modo, estado.respuestas); } catch (e) { actualizarBoton(); return; }
    estado.resultado = res; estado.guardado = null;
    pintarResultado();
    $("resultado").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function pintarResultado() {
    var res = estado.resultado, box = $("resultado");
    var html = tarjetaResultado(res, estado.modo, estado.respuestas);
    if (!estado.guardado) {
      html += '<div class="field"><label for="nota">Nota (opcional)</label><textarea id="nota" class="txt" maxlength="2000"></textarea></div>' +
        '<button id="btn-guardar" class="btn"' + (store ? "" : " disabled") + ">" + esc(BOTON[res.codigo]) + "</button>" +
        (store ? "" : '<p class="small muted hint">' + (!storeListo ? "Conectando con el historial…" : "Este navegador no deja guardar (¿modo privado?).") + "</p>") +
        '<button id="btn-cambiar" class="btn sec">Cambiar respuestas</button>';
    } else {
      html += '<div class="banner ok">Guardado en el historial.</div>' + extraTrasGuardar(estado.guardado) +
        '<div class="row"><button id="btn-nueva" class="btn sec">Nueva evaluación</button><button id="btn-ir" class="btn sec">Ver en el historial</button></div>';
    }
    box.innerHTML = html; box.hidden = false;
  }

  function formPiloto(reg) {
    var p = reg.piloto || {};
    return '<div class="card"><h3>Define la prueba</h3>' +
      '<div class="field"><label for="p-obj">Objetivo de la prueba</label><input id="p-obj" class="txt" maxlength="300" value="' + esc(p.objetivo || "") + '" placeholder="Ej.: bajar a la mitad el tiempo de cuadrar caja"></div>' +
      '<div class="field"><label for="p-lim">Límite de tiempo</label><input id="p-lim" class="txt" maxlength="120" value="' + esc(p.limite || "") + '" placeholder="Ej.: 2 semanas, máximo 1 hora al día"></div>' +
      '<div class="field"><label for="p-rev">Fecha de revisión</label><input id="p-rev" type="date" class="txt" value="' + esc(p.revisar_en || "") + '"></div>' +
      '<button id="btn-piloto" class="btn" data-id="' + esc(reg.id) + '">Guardar la prueba</button></div>';
  }

  function formSeguimiento(reg) {
    var s = reg.seguimiento || {}, delegar = reg.resultado === "DELEGAR";
    return '<div class="card"><h3>' + (delegar ? "¿A quién se lo pasas?" : "¿Cuándo lo haces?") + "</h3>" +
      (delegar ? '<div class="field"><label for="s-resp">Responsable</label><input id="s-resp" class="txt" maxlength="120" value="' + esc(s.responsable || "") + '" placeholder="Ej.: nombre de quien lo hará"></div>' : "") +
      '<div class="field"><label for="s-fecha">' + (delegar ? "Fecha para revisar que esté hecho" : "Fecha") + '</label><input id="s-fecha" type="date" class="txt" value="' + esc(s.fecha || "") + '"></div>' +
      '<button id="btn-seguimiento" class="btn" data-id="' + esc(reg.id) + '">Guardar</button></div>';
  }

  function botonesDecision(reg) {
    var pregunta = { negocio: "¿Qué hiciste al final?", personal: "¿Lo compraste?", tareas: "¿Cómo terminó?" }[reg.modo];
    return '<div class="card"><span class="lbl">' + pregunta + '</span><div class="choice" data-campo="decision" data-id="' + esc(reg.id) + '">' +
      REGISTROS.DECISIONES[reg.modo].map(function (d) { return '<button aria-pressed="' + (reg.decision === d[0]) + '" data-valor="' + d[0] + '">' + d[1] + "</button>"; }).join("") +
      '</div><p class="small muted">Tu decisión queda separada de la recomendación. Puedes registrarla después desde el historial.</p></div>';
  }

  function extraTrasGuardar(reg) {
    if (reg.resultado === "PRUEBA") return formPiloto(reg);
    if (reg.resultado === "COMPRA_RAZONABLE" || reg.resultado === "HACER") return botonesDecision(reg);
    if (reg.resultado === "PROGRAMAR" || reg.resultado === "DELEGAR") return formSeguimiento(reg);
    return "";
  }

  function guardarEvaluacion() {
    var btn = $("btn-guardar");
    var reg;
    try { reg = REGISTROS.crear(estado.modo, $("nombre").value, estado.respuestas, new Date(), estado.anterior && estado.anterior.id); }
    catch (e) { aviso("Falta completar la evaluación antes de guardar.", "err"); return; }
    reg.nota = ($("nota").value || "").trim().slice(0, 2000);
    btn.disabled = true; btn.textContent = "Guardando…";
    store.guardar(reg).then(function (leido) {
      estado.guardado = leido; aviso("");
      pintarResultado();
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = BOTON[estado.resultado.codigo];
      aviso(mensajeError(e, "No se guardó la evaluación."), "err");
    });
  }

  function mensajeError(e, base) {
    var c = e && e.code;
    if (c === "local") return base + " Este navegador no dejó guardar (puede estar en modo privado o sin espacio).";
    if (c === "quota_exceeded") return base + " El historial está lleno: elimina registros viejos y vuelve a intentar.";
    return base + " Revisa tu conexión a internet y vuelve a intentar.";
  }

  function nuevaEvaluacion(conservarModo) {
    estado.respuestas = vacias(estado.modo); estado.anterior = null;
    if (!conservarModo) { estado.modo = null; $("modo-negocio").checked = false; $("modo-personal").checked = false; }
    $("nombre").value = ""; $("reeval-info").hidden = true;
    limpiarResultado(); pintarPreguntas(); actualizarBoton();
  }

  function reevaluar(reg) {
    estado.modo = reg.modo; estado.respuestas = vacias(estado.modo); estado.anterior = reg;
    $("modo-" + reg.modo).checked = true; $("nombre").value = reg.nombre;
    var info = $("reeval-info");
    info.textContent = "Reevaluando «" + reg.nombre + "» (antes: " + MOTOR.RESULTADOS[reg.resultado].etiqueta + ", " + fechaCorta(reg.creado_en) + "). La evaluación anterior se conserva.";
    info.hidden = false;
    limpiarResultado(); pintarPreguntas(); actualizarBoton(); cambiarVista("evaluar");
    window.scrollTo({ top: 0 });
  }

  /* ---------- Historial ---------- */
  function pill(codigo) {
    var r = MOTOR.RESULTADOS[codigo];
    return '<span class="pill ' + r.tono + '">' + icono(r.icono) + esc(r.etiqueta) + "</span>";
  }

  function itemHtml(r, hoyStr) {
    var f = REGISTROS.fechaRevision(r), hijo = REGISTROS.reevaluadoPor(registros, r.id);
    var meta = ["<span>" + nombreModo(r.modo) + "</span>", "<span>" + fechaCorta(r.creado_en) + "</span>"];
    if (hijo) meta.push("<span>Reevaluado</span>");
    else if (f) meta.push(f <= hoyStr ? '<span class="due">Revisar desde ' + fechaCorta(f) + "</span>" : "<span>Revisar el " + fechaCorta(f) + "</span>");
    if (r.archivado) meta.push("<span>Archivado</span>");
    return '<li><button class="item" data-abrir="' + esc(r.id) + '"><span class="item-top"><span class="item-name">' + esc(r.nombre) + "</span>" + pill(r.resultado) + '</span><span class="meta">' + meta.join("") + "</span></button></li>";
  }

  function pintarFiltroResultados() {
    var sel = $("f-res"), actual = sel.value, modo = $("f-modo").value;
    var codigos = modo ? MOTOR.POR_MODO[modo] : ["PRUEBA", "COMPRA_RAZONABLE", "ACLARA", "ESPERA", "PAUSA", "USA_LO_QUE_TIENES", "NO_AVANZAR", "NO_COMPRAR_AHORA", "HACER", "PROGRAMAR", "DELEGAR", "ELIMINAR"];
    sel.innerHTML = '<option value="">Todos los resultados</option>' + codigos.map(function (c) { return '<option value="' + c + '">' + MOTOR.RESULTADOS[c].etiqueta + "</option>"; }).join("");
    sel.value = codigos.indexOf(actual) >= 0 ? actual : "";
  }

  function pintarHistorial() {
    var hoyStr = hoy();
    var pend = REGISTROS.pendientes(registros, hoyStr);
    var badge = $("badge"); badge.textContent = pend.length; badge.hidden = pend.length === 0;
    $("pendientes").innerHTML = pend.length ? '<div class="card"><h2>Por revisar (' + pend.length + ')</h2><ul class="list">' + pend.map(function (r) { return itemHtml(r, hoyStr); }).join("") + "</ul></div>" : "";

    var modo = $("f-modo").value, res = $("f-res").value, arch = $("f-arch").checked;
    var lista = registros.filter(function (r) {
      return (!modo || r.modo === modo) && (!res || r.resultado === res) && (arch || !r.archivado);
    }).sort(function (a, b) { return a.creado_en < b.creado_en ? 1 : -1; });
    var ul = $("lista");
    if (!storeListo) ul.innerHTML = '<li class="empty">Cargando el historial…</li>';
    else if (!store) ul.innerHTML = '<li class="empty">' + "Este navegador no deja guardar el historial (¿modo privado?)." + "</li>";
    else if (!registros.length) ul.innerHTML = '<li class="empty">Todavía no hay evaluaciones. Cuando guardes la primera, aparece aquí con su fecha de revisión.</li>';
    else if (!lista.length) ul.innerHTML = '<li class="empty">Ninguna evaluación coincide con estos filtros.</li>';
    else ul.innerHTML = lista.map(function (r) { return itemHtml(r, hoyStr); }).join("");
    pintarDetalle();
  }

  function pintarDetalle() {
    var box = $("detalle");
    var r = registros.filter(function (x) { return x.id === seleccion; })[0];
    if (!r) { box.innerHTML = ""; return; }
    var hoyStr = hoy(), preguntas = MOTOR.PREGUNTAS[r.modo];
    var anterior = registros.filter(function (x) { return x.id === r.anterior_id; })[0];
    var hijo = REGISTROS.reevaluadoPor(registros, r.id);
    var res = MOTOR.RESULTADOS[r.resultado];
    var f = REGISTROS.fechaRevision(r), puede = REGISTROS.puedeReevaluar(r, hoyStr);
    var h = '<div class="card" id="det-card"><div class="item-top"><h2 style="overflow-wrap:anywhere">' + esc(r.nombre) + '</h2><button class="link" data-cerrar>Cerrar</button></div>' +
      '<p class="meta"><span>' + nombreModo(r.modo) + "</span><span>" + fechaCorta(r.creado_en) + "</span><span>Reglas " + esc(r.version_reglas) + "</span></p>" +
      '<div class="res ' + res.tono + '"><div class="res-head">' + icono(res.icono) + '<span class="res-label" style="font-size:1.2rem">' + esc(res.etiqueta) + '</span></div><p class="res-motivo">' + esc(r.motivo) + "</p>" +
      (f ? '<p class="res-accion">Revisión: ' + fechaCorta(f) + (f <= hoyStr ? " (ya se puede reevaluar)" : "") + "</p>" : "") + "</div>" +
      '<details><summary>Respuestas</summary><ul class="ans">' + preguntas.map(function (q, i) { return "<li><span>" + (i + 1) + ". " + esc(q) + '</span><span class="chip ' + r.respuestas[i] + '">' + TXT_RESP[r.respuestas[i]] + "</span></li>"; }).join("") + "</ul></details>";
    if (anterior || r.anterior_id) h += '<p class="small">Viene de: ' + (anterior ? '<button class="link" data-abrir="' + esc(anterior.id) + '">' + esc(MOTOR.RESULTADOS[anterior.resultado].etiqueta) + " del " + fechaCorta(anterior.creado_en) + "</button>" : "una evaluación eliminada") + "</p>";
    if (hijo) h += '<p class="small">Reevaluado: <button class="link" data-abrir="' + esc(hijo.id) + '">' + esc(MOTOR.RESULTADOS[hijo.resultado].etiqueta) + " del " + fechaCorta(hijo.creado_en) + "</button></p>";
    if (r.resultado === "PRUEBA") h += formPiloto(r);
    if (r.resultado === "PROGRAMAR" || r.resultado === "DELEGAR") h += formSeguimiento(r);
    if (r.modo === "tareas") h += matriz(r.resultado);
    h += botonesDecision(r).replace("<p class=\"small muted\">Tu decisión queda separada de la recomendación. Puedes registrarla después desde el historial.</p>", "");
    if (r.modo !== "tareas") h += '<div class="card"><span class="lbl">¿Valió la pena? (opcional)</span><div class="choice" data-campo="valoracion" data-id="' + esc(r.id) + '">' +
      REGISTROS.VALORACIONES.map(function (v) { return '<button aria-pressed="' + (r.valoracion === v[0]) + '" data-valor="' + v[0] + '">' + v[1] + "</button>"; }).join("") + "</div></div>";
    h += '<div class="field"><label for="d-nota">Nota</label><textarea id="d-nota" class="txt" maxlength="2000">' + esc(r.nota) + '</textarea><button class="btn sec slim" data-nota="' + esc(r.id) + '">Guardar nota</button></div>';
    h += '<div class="row"><button class="btn" data-reevaluar="' + esc(r.id) + '"' + (puede ? "" : " disabled") + ">Reevaluar</button>" +
      '<button class="btn sec" data-archivar="' + esc(r.id) + '">' + (r.archivado ? "Sacar de archivados" : "Archivar") + "</button></div>";
    if (!puede) h += '<p class="small muted hint">La reevaluación se habilita el ' + fechaCorta(f) + ".</p>";
    h += confirmarBorrar === r.id
      ? '<div class="banner err">¿Eliminar esta evaluación para siempre? No se puede deshacer.<div class="row" style="margin-top:8px"><button class="btn danger" data-borrar-si="' + esc(r.id) + '">Sí, eliminar</button><button class="btn sec" data-borrar-no>Cancelar</button></div></div>'
      : '<button class="btn sec" data-borrar="' + esc(r.id) + '" style="color:var(--danger)">Eliminar</button>';
    h += "</div>";
    box.innerHTML = h;
  }

  function actualizar(id, cambios, okMsg) {
    var r = registros.filter(function (x) { return x.id === id; })[0];
    if (!r || !store) return Promise.resolve(false);
    var nuevo = JSON.parse(JSON.stringify(r));
    Object.keys(cambios).forEach(function (k) { nuevo[k] = cambios[k]; });
    nuevo.actualizado_en = new Date().toISOString();
    return store.guardar(nuevo).then(function (leido) {
      registros = registros.map(function (x) { return x.id === id ? leido : x; });
      if (estado.guardado && estado.guardado.id === id) { estado.guardado = leido; }
      aviso(okMsg || "", okMsg ? "ok" : "");
      return true;
    }).catch(function (e) { aviso(mensajeError(e, "No se guardó el cambio."), "err"); return false; });
  }

  /* ---------- Respaldo ---------- */
  function textoRespaldo() { return JSON.stringify(REGISTROS.exportar(registros, new Date()), null, 2); }

  function importar() {
    var msg = $("imp-msg");
    var archivo = $("imp-archivo").files[0];
    var leer = archivo ? archivo.text() : Promise.resolve($("imp-texto").value);
    leer.then(function (txt) {
      if (!txt.trim()) throw new Error("Elige un archivo o pega el texto del respaldo.");
      if (!store) throw new Error("El historial no está disponible en esta vista; no se importó nada.");
      var leido = REGISTROS.leerRespaldo(txt);
      var plan = REGISTROS.fusionar(registros, leido.validos);
      var ok = 0, fallos = 0;
      var cadena = Promise.resolve();
      plan.guardar.forEach(function (r) {
        cadena = cadena.then(function () { return store.guardar(r).then(function () { ok++; }, function () { fallos++; }); });
      });
      return cadena.then(function () {
        var partes = [plan.nuevos + " nuevas", plan.actualizados + " actualizadas", plan.omitidos + " ya estaban"];
        if (leido.invalidos) partes.push(leido.invalidos + " con datos inválidos, no importadas");
        if (fallos) partes.push(fallos + " no se pudieron guardar");
        msg.textContent = (fallos ? "Importación incompleta: " : "Listo: ") + partes.join(", ") + ".";
        msg.style.color = fallos ? "var(--danger)" : "";
        $("imp-archivo").value = ""; $("imp-texto").value = "";
      });
    }).catch(function (e) { msg.textContent = e.message || "No se pudo importar."; msg.style.color = "var(--danger)"; });
  }

  /* ---------- Navegación y eventos ---------- */
  function cambiarVista(v) {
    $("vista-evaluar").hidden = v !== "evaluar"; $("vista-historial").hidden = v !== "historial";
    $("tab-evaluar").setAttribute("aria-selected", v === "evaluar"); $("tab-historial").setAttribute("aria-selected", v === "historial");
    if (v === "historial") pintarHistorial();
  }

  $("tab-evaluar").addEventListener("click", function () { cambiarVista("evaluar"); });
  $("tab-historial").addEventListener("click", function () { cambiarVista("historial"); });

  document.querySelectorAll('input[name="modo"]').forEach(function (el) {
    el.addEventListener("change", function () {
      if (estado.modo !== el.value) { estado.modo = el.value; estado.respuestas = vacias(estado.modo); limpiarResultado(); pintarPreguntas(); }
      actualizarBoton();
    });
  });
  $("nombre").addEventListener("input", function () { if (estado.resultado && !estado.guardado) limpiarResultado(); actualizarBoton(); });
  $("preguntas").addEventListener("change", function (e) {
    var m = /^q(\d)$/.exec(e.target.name || "");
    if (!m) return;
    estado.respuestas[Number(m[1])] = e.target.value;
    if (estado.resultado && !estado.guardado) limpiarResultado();
    actualizarBoton();
  });
  $("btn-ver").addEventListener("click", verResultado);

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.id === "btn-guardar") return guardarEvaluacion();
    if (t.id === "btn-cambiar") { limpiarResultado(); $("preguntas").scrollIntoView({ behavior: "smooth" }); return; }
    if (t.id === "btn-nueva") return nuevaEvaluacion(false);
    if (t.id === "btn-ir") { seleccion = estado.guardado.id; cambiarVista("historial"); var d = $("detalle"); if (d) d.scrollIntoView({ block: "start" }); return; }
    if (t.id === "btn-piloto") {
      var obj = $("p-obj").value.trim(), lim = $("p-lim").value.trim(), rev = $("p-rev").value || null;
      return actualizar(t.dataset.id, { piloto: { objetivo: obj.slice(0, 300), limite: lim.slice(0, 120), revisar_en: rev } }, "Prueba guardada.").then(function (ok) { if (ok) { if (estado.guardado) pintarResultado(); pintarHistorial(); } });
    }
    if (t.id === "btn-seguimiento") {
      var resp = $("s-resp") ? $("s-resp").value.trim().slice(0, 120) : "";
      return actualizar(t.dataset.id, { seguimiento: { responsable: resp, fecha: $("s-fecha").value || null } }, "Guardado.").then(function (ok) { if (ok) { if (estado.guardado) pintarResultado(); pintarHistorial(); } });
    }
    var grupo = t.parentElement && t.parentElement.dataset.campo ? t.parentElement : null;
    if (grupo && t.dataset.valor) {
      var cambio = {}; var actual = t.getAttribute("aria-pressed") === "true";
      cambio[grupo.dataset.campo] = actual ? null : t.dataset.valor;
      return actualizar(grupo.dataset.id, cambio, "Guardado.").then(function (ok) { if (ok) { if (estado.guardado) pintarResultado(); pintarHistorial(); } });
    }
    if (t.dataset.abrir) { seleccion = t.dataset.abrir; confirmarBorrar = null; pintarDetalle(); var c = $("det-card"); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (t.hasAttribute("data-cerrar")) { seleccion = null; pintarDetalle(); return; }
    if (t.dataset.nota) return actualizar(t.dataset.nota, { nota: $("d-nota").value.trim().slice(0, 2000) }, "Nota guardada.").then(function (ok) { if (ok) pintarHistorial(); });
    if (t.dataset.reevaluar) { var r = registros.filter(function (x) { return x.id === t.dataset.reevaluar; })[0]; if (r && REGISTROS.puedeReevaluar(r, hoy())) reevaluar(r); return; }
    if (t.dataset.archivar) { var ra = registros.filter(function (x) { return x.id === t.dataset.archivar; })[0]; return actualizar(ra.id, { archivado: !ra.archivado }, ra.archivado ? "Sacado de archivados." : "Archivado.").then(function (ok) { if (ok) pintarHistorial(); }); }
    if (t.dataset.borrar) { confirmarBorrar = t.dataset.borrar; pintarDetalle(); return; }
    if (t.hasAttribute("data-borrar-no")) { confirmarBorrar = null; pintarDetalle(); return; }
    if (t.dataset.borrarSi) {
      var id = t.dataset.borrarSi;
      store.borrar(id).then(function () {
        registros = registros.filter(function (x) { return x.id !== id; }); seleccion = null; confirmarBorrar = null;
        aviso("Evaluación eliminada.", "ok"); pintarHistorial();
      }).catch(function (e2) { aviso(mensajeError(e2, "No se eliminó."), "err"); });
      return;
    }
    if (t.id === "btn-exportar" && PUBLICO) {
      try {
        var url = URL.createObjectURL(new Blob([textoRespaldo()], { type: "application/json" }));
        var a = document.createElement("a"); a.href = url; a.download = "filtro-decisiones-respaldo-" + hoy() + ".json";
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
        $("imp-msg").textContent = "Respaldo descargado (" + registros.length + " evaluaciones). Guárdalo fuera del celular, por ejemplo en tu correo."; $("imp-msg").style.color = "";
      } catch (e3) { $("imp-msg").textContent = "No se descargó. Usa «Copiar respaldo» y pégalo en una nota o un correo."; $("imp-msg").style.color = "var(--danger)"; }
      return;
    }
    if (t.id === "btn-copiar") {
      var txt = textoRespaldo();
      var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject();
      p.then(function () { $("imp-msg").textContent = "Respaldo copiado (" + registros.length + " evaluaciones). Pégalo en una nota o un correo."; $("imp-msg").style.color = ""; })
        .catch(function () { $("imp-texto").value = txt; $("imp-texto").select(); $("imp-msg").textContent = "No se pudo copiar solo: el texto quedó seleccionado en el recuadro, cópialo a mano."; });
      return;
    }
    if (t.id === "btn-importar") return importar();
  });
  $("f-modo").addEventListener("change", function () { pintarFiltroResultados(); pintarHistorial(); });
  $("f-res").addEventListener("change", pintarHistorial);
  $("f-arch").addEventListener("change", pintarHistorial);

  /* ---------- Arranque ---------- */
  if (PUBLICO) {
    $("lbl-negocio").textContent = "Trabajo";
    document.querySelector('#f-modo option[value="negocio"]').textContent = "Trabajo";
    $("txt-respaldo").textContent = "Tu historial se guarda solo en este navegador: nadie más lo ve. Si borras los datos del navegador o cambias de celular, se pierde. Descarga un respaldo de vez en cuando y guárdalo en tu correo.";
  }
  pintarPreguntas(); actualizarBoton(); pintarFiltroResultados(); pintarHistorial();

  if (PUBLICO) {
    storeListo = true;
    try {
      window.localStorage.setItem("filtro-decisiones.prueba", "1"); window.localStorage.removeItem("filtro-decisiones.prueba");
      store = REGISTROS.almacenLocal(window.localStorage);
      store.suscribir(function (lista) { registros = lista.map(REGISTROS.validar).filter(Boolean); pintarHistorial(); });
      window.addEventListener("storage", function () { store.leerTodo().then(function (l) { registros = l.map(REGISTROS.validar).filter(Boolean); pintarHistorial(); }); });
    } catch (e) {
      store = null;
      aviso("Este navegador no deja guardar (¿modo privado?). Puedes evaluar, pero el historial no se va a guardar.", "err");
      pintarHistorial();
    }
    return;
  }

})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
